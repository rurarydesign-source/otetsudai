<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おてつだいクエスト</title>
<style>
:root{--ink:#2b2a33;--card:#fffdf6;--line:#e4d9b8;--gold:#f5b301;--ok:#2e9e5b;--bg1:#cfeec0;--bg2:#8fd18a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#2b2a33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;transition:background .4s}
body.s2{--bg1:#bfe6f5;--bg2:#6fb7d6}
body.s3{--bg1:#ffd9a0;--bg2:#e0825f}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
h1{margin:0;font-size:clamp(20px,3.4vw,30px)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.money{background:var(--card);border:3px solid var(--gold);border-radius:16px;padding:8px 14px;font-weight:800;font-size:clamp(16px,2.6vw,22px)}
.money small{font-weight:600;color:#6b6655}
.btn{min-height:48px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.45}
.btn.warn{background:#ffe0dc;border-color:#e57a6e}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab{flex:1 1 140px;min-height:52px;border-radius:14px;border:3px solid var(--line);background:var(--card);font:inherit;font-weight:800;color:var(--ink);padding:6px 10px;cursor:pointer}
.tab.on{border-color:var(--ink);background:#fff3b8}
.tab[disabled]{opacity:.45}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:clamp(16px,2.4vw,20px)}
.progress{font-weight:700;margin-bottom:8px}
.bar{height:14px;background:#e9e2c8;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#46c26f,#f5b301);width:0;transition:width .4s}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{min-height:92px;border-radius:12px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 2px;font-size:clamp(11px,1.8vw,14px);position:relative}
.cell .n{font-weight:800;color:#6b6655;align-self:flex-start;padding-left:3px}
.cell.done{background:#e3f6dc}
.cell.here{border-color:var(--ink);background:#fff3b8}
.cell .cat{font-size:clamp(22px,4vw,34px);line-height:1;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.cell .bug{font-size:clamp(14px,2.4vw,20px);line-height:1}
.cell .bug svg{width:1.3em;height:1.3em;vertical-align:middle}
.chest{border:0;background:#fff3b8;border-radius:10px;font-size:clamp(20px,3.4vw,28px);min-width:44px;min-height:44px;line-height:1;cursor:pointer;padding:2px 4px}
.chest small{display:block;font-size:11px;font-weight:800}
.chest.locked{filter:grayscale(1);opacity:.55;cursor:default}
.chest.ready{background:var(--gold);animation:glow 1s infinite alternate}
.chest.open{background:#d8f0d0;cursor:default}
@keyframes glow{to{box-shadow:0 0 0 6px rgba(245,179,1,.35)}}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.task{min-height:72px;display:flex;align-items:center;gap:10px;text-align:left;border-radius:16px;border:3px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:clamp(15px,2.2vw,18px);color:var(--ink);padding:8px 12px;cursor:pointer}
.task:active{transform:scale(.97);background:#fff3b8}
.task .e{font-size:34px}
.task .p{margin-left:auto;background:var(--ok);color:#fff;border-radius:12px;padding:4px 10px;white-space:nowrap}
.readyBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ci{min-height:92px;border-radius:14px;border:3px solid var(--line);background:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;color:var(--ink);cursor:pointer}
.ci .ic{font-size:36px;line-height:1}
.ci .ic svg{width:42px;height:42px}
.ci small{font-weight:700;font-size:12px}
.ci.off{background:#ece8d6;cursor:default}
.ci.off .ic{filter:grayscale(1);opacity:.35}
.ci.in{border-color:var(--ok);background:#e3f6dc}
.cage{position:relative;height:clamp(260px,42vh,420px);border-radius:22px;border:8px solid #7a5a35;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(210,240,255,.35) 60%,rgba(120,90,50,.0)),linear-gradient(180deg,#dff3ff,#c9ecd0);box-shadow:inset 0 0 30px rgba(255,255,255,.7),0 6px 0 #5b4226;touch-action:pan-y}
.cage .floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:radial-gradient(circle at 20% 30%,#a8764a 0 3px,transparent 4px),linear-gradient(#8a6a3f,#6d5130);background-size:34px 34px,100% 100%;pointer-events:none}
.cage .grass{position:absolute;left:0;right:0;bottom:20%;height:12%;background:repeating-linear-gradient(100deg,#4aa84a 0 6px,transparent 6px 12px);opacity:.7;pointer-events:none}
.cage .shine{position:absolute;left:6%;top:6%;width:18%;height:60%;background:linear-gradient(100deg,rgba(255,255,255,.55),transparent);border-radius:12px;pointer-events:none}
.cage .lid{position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(90deg,#5b4226 0 10px,#7a5a35 10px 20px);pointer-events:none}
.mb{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;display:flex;align-items:center;justify-content:center;font-size:56px;line-height:1;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.mb svg{width:70px;height:70px;pointer-events:none}
.mb.drag{cursor:grabbing;z-index:5;transform:scale(1.12)}
.hint{font-size:13px;color:#6b6655;margin:6px 2px 0}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:#fff;border-radius:18px;padding:14px 22px;font-weight:800;font-size:clamp(18px,3vw,26px);z-index:50;pointer-events:none;transition:transform .3s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:640px){.board{gap:4px}.cell{min-height:64px}.tasks{grid-template-columns:1fr}}

/* ===== v2: scenery board, realistic cage ===== */
.boardwrap{position:relative;border-radius:20px;padding:100px 30px 40px;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
body.s1 .boardwrap{background:linear-gradient(180deg,#7fcdf2 0,#d4f0fc 16%,#a6df8a 17%,#74c45e 100%)}
body.s2 .boardwrap{background:linear-gradient(180deg,#8fd6f5 0,#d9f4fc 16%,#7fd0e0 17%,#3f9fcb 100%)}
body.s3 .boardwrap{background:linear-gradient(180deg,#5a3d8c 0,#e8765f 12%,#ffc27a 17%,#6a4a78 18%,#34264f 100%)}
.deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.board{position:relative;z-index:1;gap:22px 8px;grid-template-columns:repeat(6,minmax(0,1fr))}
.cell{min-height:88px;border:4px solid #fff;border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.2);background:#ffe9a8}
.cell.c0{background:#ffd3de}.cell.c1{background:#ffe9a8}.cell.c2{background:#d1f0c0}.cell.c3{background:#cde6ff}.cell.c4{background:#e5d6ff}
.cell.done{background:#b8ebae}
.cell.here{border-color:#ffd23f;background:#fff3b8;box-shadow:0 0 0 4px rgba(255,210,63,.6),0 4px 0 rgba(0,0,0,.2)}
.cell .bug{font-size:clamp(24px,3.8vw,34px)}
.cell .bug svg{width:1.2em;height:1.2em}
.sil{display:inline-block;filter:brightness(0) opacity(.3);animation:wig 1.4s ease-in-out infinite}
@keyframes wig{50%{transform:translateY(-4px) rotate(8deg)}}
.cell .cat{font-size:clamp(28px,4.6vw,40px);animation:pop .5s,hop 1.6s .6s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-4px)}}
.cageBox{position:relative;max-width:740px;margin:30px auto 0}
.cageBox::before{content:"";position:absolute;left:50%;top:-24px;width:130px;height:44px;transform:translateX(-50%);border:9px solid #5b4226;border-bottom:0;border-radius:44px 44px 0 0;pointer-events:none}
.cage{height:auto;width:100%;aspect-ratio:4/3;border-radius:18px;border:12px solid #8a5f33;background:#cfeefa;overflow:hidden;box-shadow:inset 0 0 0 3px #5b4226,inset 0 0 40px rgba(255,255,255,.55),0 8px 0 #5b4226,0 14px 18px rgba(0,0,0,.25)}
.cage .scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cage .shine{position:absolute;left:5%;top:12%;width:13%;height:62%;background:linear-gradient(100deg,rgba(255,255,255,.6),rgba(255,255,255,0));border-radius:14px;pointer-events:none;transform:skewX(-8deg)}
.cage .lid{position:absolute;left:0;right:0;top:0;height:7%;background:radial-gradient(circle,#2d2f33 0 2px,transparent 2.6px) 0 0/12px 12px,#7b8087;border-bottom:3px solid #5b4226;pointer-events:none}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 3s ease-out infinite}
@keyframes rip{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.mb{width:92px;height:92px;margin:-46px 0 0 -46px;font-size:68px}
.mb svg{width:84px;height:84px}
.mb .in{display:block;line-height:1;animation:bob 3s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (max-width:640px){.boardwrap{padding:88px 8px 28px}.board{gap:16px 5px}.cell{min-height:70px;border-width:3px}.mb{width:70px;height:70px;margin:-35px 0 0 -35px;font-size:50px}.mb svg{width:62px;height:62px}.cage{border-width:9px}}

/* ===== v3: winding sugoroku board ===== */
.sg{position:relative;container-type:inline-size;width:100%;max-width:760px;margin:0 auto;aspect-ratio:100/108;border-radius:22px;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.18);overflow:hidden}
body.s1 .sg{background:linear-gradient(180deg,#7fcdf2,#d4f0fc 10%)}
body.s2 .sg{background:linear-gradient(180deg,#8fd6f5,#d9f4fc 10%)}
body.s3 .sg{background:linear-gradient(180deg,#5a3d8c,#e8765f 5%,#ffc27a 10%)}
.sg #road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sg .deco{z-index:1}
.sg .deco span{transform:translate(-50%,-50%)}
.sg .start{position:absolute;transform:translate(-50%,-50%);background:#a8743a;color:#fff;border:max(2px,.5cqw) solid #6d4a22;border-radius:1.4cqw;padding:.6cqw 2cqw;font-weight:900;font-size:max(10px,3.2cqw);letter-spacing:.1em;box-shadow:0 .6cqw 0 rgba(0,0,0,.25);white-space:nowrap}
.sg .cell{position:absolute;z-index:2;width:11.5%;aspect-ratio:1/.92;min-height:0;padding:0;display:block;border:max(2px,.55cqw) solid #fff;border-radius:24%;box-shadow:0 .7cqw 0 rgba(0,0,0,.22);transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.sg .cell .n{position:absolute;left:14%;top:6%;font-size:max(9px,2.6cqw);padding:0;font-weight:800;color:#5b5666}
.sg .cell .bug{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:max(15px,5.6cqw);padding-top:1.2cqw}
.sg .cell.here{background:#fff3b8;box-shadow:0 0 0 1cqw rgba(255,210,63,.7),0 .7cqw 0 rgba(0,0,0,.22)}
.sg .ch{position:absolute;z-index:4;width:16%;min-width:46px;aspect-ratio:1;min-height:0;transform:translate(-50%,-50%);border-radius:50%;border:max(2px,.6cqw) solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font:inherit;font-weight:800;line-height:1;color:#5b3b00;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ffe98a,#f5b301);box-shadow:0 .9cqw 0 rgba(0,0,0,.25)}
.sg .ch i{font-style:normal;font-size:max(9px,2.8cqw)}
.sg .ch b{font-size:max(15px,5.4cqw);line-height:1.05}
.sg .ch small{display:block;font-size:max(9px,2.4cqw);background:#e2553f;color:#fff;border-radius:99px;padding:0 1.2cqw;margin-top:.3cqw}
.sg .ch.locked{filter:grayscale(.9);opacity:.65;animation:none;cursor:default}
.sg .ch.ready{animation:glow2 .9s infinite alternate}
.sg .ch.open{background:radial-gradient(circle at 35% 30%,#e3f9da,#7fd36b);animation:none;cursor:default}
@keyframes glow2{to{box-shadow:0 0 0 1.4cqw rgba(255,210,63,.5),0 .9cqw 0 rgba(0,0,0,.25)}}
#catEl{position:absolute;z-index:5;pointer-events:none;font-size:max(28px,9cqw);line-height:1;transform:translate(-50%,-62%);transition:left .7s ease,top .7s ease;filter:drop-shadow(0 .7cqw 0 rgba(0,0,0,.2))}
#catEl span{display:block;animation:hop 1.3s ease-in-out infinite}
.sg .cell.hc{opacity:0}
</style>
</head>

="92" r="28" fill="#5cbb5f"/><circle cx="140" cy="78" r="26" fill="#3fa34d"/><circle cx="20" cy="108" r="18" fill="#2f8a3f"/><circle cx="118" cy="158" r="18" fill="#5cbb5f"/><circle cx="76" cy="62" r="16" fill="#7bd07a" opacity=".85"/><path d="M150 262q4-22 8-2q6-20 8 2q6-16 8 2z" fill="#4aa84a"/><path d="M215 250q3-18 7-2q5-16 7 2q5-12 7 2z" fill="#58b84f"/><g><rect x="324" y="238" width="6" height="14" fill="#f5ecd2"/><path d="M314 240Q327 218 340 240Z" fill="#e0453a"/><circle cx="322" cy="234" r="2" fill="#fff"/><circle cx="331" cy="231" r="2" fill="#fff"/></g><g><circle cx="190" cy="285" r="4" fill="#ffd23f"/><circle cx="196" cy="283" r="4" fill="#ff8fb1"/><circle cx="330" cy="288" r="4" fill="#ffd23f"/></g></svg><div class="shine"></div><div class="lid"></div></div></div></div></div><p class="hint">虫を指でドラッグして好きな場所へ動かせるよ</p></div>
</div>
<div class="toast" id="toast"></div>
<script>

 {id:"tonbo",cell:37,name:"トンボ",svg:"d"},{id:"katatsumuri",cell:47,name:"かたつむり",e:"🐌"},{id:"kaeru",cell:57,name:"カエル",e:"🐸"},
 {id:"kuwagata",cell:66,name:"クワガタ",svg:"k"},{id:"tentou",cell:74,name:"てんとう虫",e:"🐞"},{id:"semi",cell:82,name:"セミ",svg:"s"},{id:"kamakiri",cell:88,name:"カマキリ",svg:"m"}];

var COLS=[9,25.4,41.8,58.2,74.6,91],ROWY=[15,33,51,69,87];
function tpos(i){var r=Math.floor(i/6),c=i%6;if(r%2)c=5-c;return[COLS[c],ROWY[r]+2.4*Math.sin(c*1.3+r)]}
function roadD(){var P=[],i;for(i=0;i<30;i++){P.push(tpos(i));if(i%6===5&&i<29){var a=tpos(i),b=tpos(i+1);P.push([a[0]>50?95:5,(a[1]+b[1])/2])}}
 var d="M"+P[0][0]+" "+P[0][1];
 for(i=0;i<P.length-1;i++){var p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=" C"+(p1[0]+(p2[0]-p0[0])/6)+" "+(p1[1]+(p2[1]-p0[1])/6)+" "+(p2[0]-(p3[0]-p1[0])/6)+" "+(p2[1]-(p3[1]-p1[1])/6)+" "+p2[0]+" "+p2[1]}
 return d}
var AC=null,SND=true;try{SND=localStorage.getItem("oq-snd")!=="0"}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){try{AC.resume()}catch(e){}}return AC}
function tone(f,t0,d,type,vol,f2){var a=ac();if(!a||!SND)return;var t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
var PENTA=[523,587,659,784,880,1047];
function sfxTap(){tone(700,0,.07,"triangle",.14,900)}
function sfxStep(n){for(var i=0;i<Math.min(n,6);i++)tone(PENTA[i],i*.09,.16,"triangle",.2)}
function sfxBug(){[659,784,988,1319,1568].forEach(function(f,i){tone(f,i*.09,.22,"square",.1)});tone(1568,.5,.5,"triangle",.14)}
function sfxCoin(){tone(988,0,.09,"square",.11);tone(1319,.09,.45,"square",.11);tone(1976,.2,.4,"sine",.1)}
function sfxReady(){tone(880,0,.1,"sine",.16);tone(1175,.12,.25,"sine",.16)}
function sfxPop(){tone(380,0,.12,"sine",.2,820)}
function sfxUndo(){tone(660,0,.1,"triangle",.16);tone(440,.1,.16,"triangle",.16)}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");ac();if(b&&!b.closest(".task")&&b.id!=="snd")sfxTap()},true);
var S=load();
var view=stageOf(S.pos);
function def(){return{pos:0,claimed:[],bugs:[],cage:{},hist:[]}}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j.pos==="number")return Object.assign(def(),j)}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function stageOf(p){return p<=30?1:p<=60?2:3}
function $(id){return document.getElementById(id)}
function snap(){return JSON.stringify({pos:S.pos,claimed:S.claimed,bugs:S.bugs,cage:S.cage})}
function pushHist(){S.hist.push(snap());if(S.hist.length>40)S.hist.shift()}
function money(){return S.claimed.reduce(function(a,c){return a+(REWARD[c]||0)},0)}
var tt;function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("show")},2200)}

function addSteps(n,label){
  pushHist();
  var before=S.pos;S.pos=Math.min(90,S.pos+n);
  var msgs=[label+" ＋"+n+"マス！"],gotBug=false,gotChest=false;
  BUGS.forEach(function(b){if(b.cell>before&&b.cell<=S.pos&&S.bugs.indexOf(b.id)<0){S.bugs.push(b.id);gotBug=true;msgs.push(b.name+"を みつけた！")}});
  for(var c=10;c<=90;c+=10){if(c>before&&c<=S.pos){gotChest=true;msgs.push(c+"マス到達！宝箱をタップ！")}}
  if(before<=30&&S.pos>30)msgs.push("STAGE 2 へ！");if(before<=60&&S.pos>60)msgs.push("STAGE 3 へ！");
  if(S.pos>=90)msgs.push("ゴール！");
  view=stageOf(S.pos);if(S.pos===30||S.pos===60)view=S.pos/30;
  sfxStep(n);if(gotBug)setTimeout(sfxBug,n*90+250);if(gotChest)setTimeout(sfxReady,n*90+(gotBug?1100:250));save();render();toast(msgs.slice(-2).join("\n").replace(/\n/g," / "));
}
function claim(c){
  if(S.pos<c||S.claimed.indexOf(c)>=0)return;
  pushHist();S.claimed.push(c);sfxCoin();save();render();toast("🎉 "+REWARD[c]+"円ゲット！");
}
function undo(){
  if(!S.hist.length){toast("もどせるものがないよ");return}
  var h=JSON.parse(S.hist.pop());S.pos=h.pos;S.claimed=h.claimed;S.bugs=h.bugs;S.cage=h.cage;
  sfxUndo();view=stageOf(S.pos);save();render();toast("↩ ひとつもどしたよ");
}
var rt;
$("reset").addEventListener("click",function(){
  var b=$("reset");
  if(b.dataset.arm){clearTimeout(rt);delete b.dataset.arm;b.textContent="リセット";S=def();view=1;sfxUndo();save();render();toast("さいしょから はじめよう！");return}
  b.dataset.arm="1";b.textContent="ほんとうに？もういちど";rt=setTimeout(function(){delete b.dataset.arm;b.textContent="リセット"},4000);
});
function sndLabel(){$("snd").textContent=SND?"🔊":"🔇"}
$("snd").addEventListener("click",function(){SND=!SND;try{localStorage.setItem("oq-snd",SND?"1":"0")}catch(e){}sndLabel();if(SND)sfxCoin()});sndLabel();
$("undo").addEventListener("click",undo);

function render(){
  document.body.className="s"+view;
  $("money").textContent=money().toLocaleString();
  $("prog").textContent="いま "+S.pos+" / 90 マス　（STAGE "+stageOf(S.pos)+"）";
  $("barfill").style.width=(S.pos/90*100)+"%";
  // tabs
  var t=$("tabs");t.innerHTML="";
  STAGES.forEach(function(name,i){
    var s=i+1,b=document.createElement("button");b.className="tab"+(view===s?" on":"");b.textContent=name;
    var open=S.pos>=(s-1)*30;b.disabled=!open;if(!open)b.textContent="🔒 "+name;
    b.addEventListener("click",function(){view=s;render()});t.appendChild(b);
  });
  $("stageTitle").textContent=STAGES[view-1];
  
  // ready chests
  var rb=$("readyBar");rb.innerHTML="";var any=false;
  for(var c=10;c<=90;c+=10){if(S.pos>=c&&S.claimed.indexOf(c)<0){any=true;(function(c){var b=document.createElement("button");b.className="btn";b.textContent="🎁 "+c+"マスの宝箱（"+REWARD[c]+"円）";b.addEventListener("click",function(){claim(c)});rb.appendChild(b)})(c)}}
  $("readyCard").hidden=!any;
  // sugoroku board
  var base=(view-1)*30,GR=["#86d06b","#4fb3d6","#5d4382"][view-1],rd=roadD();
  $("road").innerHTML='<path d="M0 9Q22 3 45 8T100 6V108H0Z" fill="'+GR+'"/><ellipse cx="22" cy="48" rx="26" ry="10" fill="#fff" opacity=".1"/><ellipse cx="80" cy="78" rx="24" ry="9" fill="#fff" opacity=".1"/><path d="'+rd+'" fill="none" stroke="#fff" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/><path d="'+rd+'" fill="none" stroke="#f1d79b" stroke-width="9.3" stroke-linecap="round" stroke-linejoin="round"/>';
  $("deco").innerHTML=DECO[view-1].map(function(d){return '<span style="left:'+d[1]+"%;top:"+d[2]+"%;font-size:"+d[3]+'cqw">'+d[0]+"</span>"}).join("")+'<div class="start" style="left:26%;top:'+(6/1.08)+'%">'+(view===1?"START":"STAGE "+view)+"</div>";
  var bd=$("board");bd.innerHTML="";
  for(var i=0;i<30;i++){
    var n=base+i+1,tp=tpos(i),cell=document.createElement("div");
    cell.className="cell c"+(n%5)+(REWARD[n]?" hc":"")+(n<=S.pos?" done":"")+(n===S.pos?" here":"");
    cell.style.left=tp[0]+"%";cell.style.top=(tp[1]/1.08)+"%";cell.style.setProperty("--r",(i%2?3:-3)+"deg");
    var nn=document.createElement("span");nn.className="n";nn.textContent=n;cell.appendChild(nn);
    var bg=BUGS.filter(function(b){return b.cell===n})[0];
    if(bg){var bs=document.createElement("span");bs.className="bug";bs.innerHTML=S.bugs.indexOf(bg.id)>=0?icon(bg):'<span class="sil">'+icon(bg)+"</span>";cell.appendChild(bs)}
    bd.appendChild(cell);
    if(REWARD[n]){
      var ch=document.createElement("button"),st=S.claimed.indexOf(n)>=0?"open":S.pos>=n?"ready":"locked";
      ch.className="chest ch "+st;ch.style.left=tp[0]+"%";ch.style.top=(tp[1]/1.08)+"%";
      ch.innerHTML="<i>"+n+"</i><b>"+(st==="open"?"✅":"🎁")+"</b><small>"+REWARD[n]+"円</small>";
      if(st==="ready")(function(n){ch.addEventListener("click",function(){claim(n)})})(n);else ch.setAttribute("aria-disabled","true");
      bd.appendChild(ch);
    }
  }
  var ci=S.pos-base,ct=$("catEl");
  if(ci<0||ci>30)ct.style.display="none";else{ct.style.display="";var cp=ci===0?[9,6]:(function(t){return[t[0],t[1]-5.5]})(tpos(ci-1));ct.style.left=cp[0]+"%";ct.style.top=(cp[1]/1.08)+"%"}

  var cl=$("coll");cl.innerHTML="";$("collCount").textContent="（"+S.bugs.length+" / 10）";
  BUGS.forEach(function(b){
    var got=S.bugs.indexOf(b.id)>=0,inCage=!!S.cage[b.id];
    var el=document.createElement("button");el.className="ci"+(got?"":" off")+(inCage?" in":"");
    el.innerHTML='<span class="ic">'+(got?icon(b):"❓")+"</span><small>"+(got?b.name:b.cell+"マスで…")+"</small>";
    if(got)el.addEventListener("click",function(){toggleCage(b)});
    cl.appendChild(el);
  });
  renderCage();
}
function toggleCage(b){
  if(S.cage[b.id])delete S.cage[b.id];
  else S.cage[b.id]={x:15+Math.random()*70,y:30+Math.random()*50};
  sfxPop();save();render();
}
function renderCage(){
  var cg=$("cage");Array.prototype.slice.call(cg.querySelectorAll(".mb")).forEach(function(e){e.remove()});
  BUGS.forEach(function(b){
    var p=S.cage[b.id];if(!p||S.bugs.indexOf(b.id)<0)return;
    var el=document.createElement("div");el.className="mb";el.style.left=p.x+"%";el.style.top=p.y+"%";el.innerHTML='<span class="in">'+icon(b)+"</span>";el.setAttribute("aria-label","むし");
    var drag=false;
    el.addEventListener("pointerdown",function(ev){drag=true;sfxPop();el.setPointerCapture(ev.pointerId);el.classList.add("drag");ev.preventDefault()});
    el.addEventListener("pointermove",function(ev){
      if(!drag)return;var r=cg.getBoundingClientRect();
      p.x=Math.max(6,Math.min(94,(ev.clientX-r.left)/r.width*100));p.y=Math.max(10,Math.min(92,(ev.clientY-r.top)/r.height*100));
      el.style.left=p.x+"%";el.style.top=p.y+"%";
    });
    function end(){if(!drag)return;drag=false;el.classList.remove("drag");sfxTap();save()}
    el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
    cg.appendChild(el);
  });
}
var tk=$("tasks");
TASKS.forEach(function(t){
  var b=document.createElement("button");b.className="task";
  b.innerHTML='<span class="e">'+t[0]+"</span><span>"+t[1]+'</span><span class="p">＋'+t[2]+"マス</span>";
  b.addEventListener("click",function(){
    if(S.pos>=90){toast("もうゴールしたよ！");return}
    addSteps(t[2],t[1]);
  });
  tk.appendChild(b);
});
window.__app={get S(){return S},render:render};
render();
})();
